<ol class="list-group">
  @for (cv of cvs(); track cv.id; let isOdd = $odd) {
    <li
    [ngClass]="{
      'list-group-item-primary': isOdd,
      'list-group-item-secondary': !isOdd
    }"
      class="list-group-item"
      >
      <app-item [cv]="cv" />
    </li>
  } @empty {
    <li class="list-group-item">Aucun cv à afficher</li>
  }
</ol>
