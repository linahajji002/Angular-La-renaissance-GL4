<ol class="list-group">
  <li
    *ngFor="let cv of cvs; let isOdd = odd"
    [ngClass]="{
      'list-group-item-primary': isOdd,
      'list-group-item-secondary': !isOdd
    }"
    class="list-group-item"
    [routerLink]="detailsLink ? [detailsLink, cv.id] : null"
    routerLinkActive="active"
  >
    <!--     (selectCv)="forwardCv.emit(cv)"-->
    <app-item [cv]="cv"></app-item>
  </li>
</ol>
