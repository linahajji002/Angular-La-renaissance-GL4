<input class="form-control" [formControl]="search" placeholder="Chercher un CV" />

@if (cvs$ | async; as cvs) {
  <ul class="list-group">
    @for (cv of cvs; track cv.id) {
      <li class="list-group-item" (click)="selectCv(cv)">
        {{ cv.name }} {{ cv.firstname }}
      </li>
    }
  </ul>
}
