<div class="row">
  <div class="col">
    <div class="alert alert-warning">
      {{ date | date : "full" | uppercase }}
    </div>
    <app-list [cvs]="cvs"></app-list>
  </div>
  <div class="col">
    <app-cv-card [cv]="selectedCv"></app-cv-card>
  </div>
</div>
@defer (on viewport; prefetch on idle) {
  <app-embauche />
} @placeholder (minimum 500ms) {
  <div class="mt-2 text-muted" style="min-height: 40px">
    Liste des pré-embauchés…
  </div>
} @loading (after 100ms; minimum 1s) {
  <div class="mt-2 text-muted">Chargement…</div>
} @error {
  <div class="alert alert-danger mt-2">
    Impossible de charger la liste des pré-embauchés.
  </div>
}
