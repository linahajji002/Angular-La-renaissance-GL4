<div class="bg-info-subtle p-2 rounded">
  <div class="row g-2 mb-2">
    <div class="col">
      <input [(ngModel)]="name" placeholder="name" type="text" class="form-control form-control-sm">
    </div>
    <div class="col">
      <input [(ngModel)]="content" placeholder="content" type="text" class="form-control form-control-sm">
    </div>
    <div class="col-auto">
      <button (click)="addTodo()" [disabled]="!canAdd()" class="btn btn-danger btn-sm">add</button>
    </div>
  </div>

  <div class="row g-0">
    @for (column of columns; track column.title) {
      <div class="col border p-2" [class]="column.css">
        <h5>{{ column.title }}</h5>
        @for (todo of column.todos(); track todo.id) {
          <app-todo-card
            [todo]="todo"
            (statusChange)="changeStatus(todo.id, $event)"
            (remove)="deleteTodo(todo.id)"
          />
        }
      </div>
    }
  </div>
</div>
